# Padrão do servidor do TI:
# - os dados ficam em pastas do host em /docker/volumes/sementelivre/
#   (banco, fotos, Caddy e backups), não em volumes nomeados do Docker;
# - o serviço de entrada (caddy) entra também na rede docker-net, que já existe
#   no servidor (external: true). O resto fica só na app-network.
services:
  db:
    image: postgres:15-alpine
    container_name: semente_livre_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-semente_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina a variavel DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:-semente_prod}
    volumes:
      - /docker/volumes/sementelivre/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-semente_user} -d ${DB_NAME:-semente_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # A pasta do host nasce do root, e o backend roda sem root (usuário spring):
  # sem este passo, o upload de foto falha com "Não foi possível salvar a foto".
  # Roda e termina antes do app, a cada subida.
  uploads-permissao:
    # Mesmo Dockerfile do app (o build sai do cache), para ter o usuário spring
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semente_livre_uploads_permissao_prod
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /app/uploads/produtos && chown -R spring:spring /app/uploads"]
    volumes:
      - /docker/volumes/sementelivre/uploads:/app/uploads
    network_mode: none

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semente_livre_app_prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-semente_prod}
      DB_USERNAME: ${DB_USER:-semente_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina a variavel JWT_SECRET no .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_INICIAL_EMAIL: ${ADMIN_INICIAL_EMAIL:-}
      ADMIN_INICIAL_SENHA: ${ADMIN_INICIAL_SENHA:-}
    volumes:
      #Persistência de fotos cadastradas pelos produtores
      - /docker/volumes/sementelivre/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      uploads-permissao:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  #proxy reverso com HTTPS e emissão de certificados Let's Encrypt automática
  caddy:
    image: caddy:2-alpine
    container_name: semente_livre_caddy_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    # Na docker-net, "app" pode ser o serviço de outro projeto do servidor;
    # o nome do container é único, então o Caddy sempre chega ao nosso backend.
    command: caddy reverse-proxy --from ${DOMAIN_NAME:-localhost} --to semente_livre_app_prod:8080
    volumes:
      - /docker/volumes/sementelivre/caddy/data:/data
      - /docker/volumes/sementelivre/caddy/config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
      - docker-net

  #Backup automático diário do PostgreSQL (retenção de 7 dias)
  db-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: semente_livre_backup_prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-semente_prod}
      POSTGRES_USER: ${DB_USER:-semente_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_SUFFIX: .sql.gz
    volumes:
      - /docker/volumes/sementelivre/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  docker-net:
    external: true
