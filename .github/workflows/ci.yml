name: CI - Backend

on:
  push:
    branches: [ main, developer ]
    paths:
      - 'estudo-spring-docker/demo/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, developer ]
    paths:
      - 'estudo-spring-docker/demo/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    name: Build e testes (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estudo-spring-docker/demo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build e testes com Maven
        run: ./mvnw --batch-mode clean verify

      - name: Publicar relatório de testes (mesmo se falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: estudo-spring-docker/demo/target/surefire-reports